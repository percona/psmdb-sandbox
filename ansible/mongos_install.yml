- name: Install mongos routers
  hosts: mongos
  gather_facts: "{{ not (skip_repeated_facts | default(false) | bool) }}"
  become: yes
  tags: mongos

  environment:
    PERCONA_TELEMETRY_DISABLE: "{{ '1' if disable_telemetry else '0' }}"

  tasks:
    # main.yml already ran this in the "Install MongoDB" play.
    - name: Install and configure mongos
      import_tasks: tasks/mongos_prepare.yml
      when: not (mongos_prepared | default(false) | bool)

    - name: Restart mongos to apply configuration changes
      systemd:
        name: mongos
        state: restarted
        enabled: yes
        daemon_reload: yes
      when: mongos_restart_needed | default(false) | bool

    - name: Ensure the mongos router service is started
      systemd:
        name: mongos
        state: started
        enabled: yes
        daemon_reload: yes
