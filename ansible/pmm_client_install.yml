---
- name: Gather facts from the PMM server
  hosts: pmm
  gather_facts: "{{ not (skip_repeated_facts | default(false) | bool) }}"
  tags: monitoring
  tasks:
    - name: Dummy task to force fact gathering
      debug:
        msg: "Facts collected for PMM server"
      when: pmm_enabled | bool

- name: Install PMM client
  hosts: cfg:shards:replsets:mongos
  gather_facts: "{{ not (skip_repeated_facts | default(false) | bool) }}"
  become: yes
  tags: install,monitoring
  environment:
    PERCONA_TELEMETRY_DISABLE: "{{ '1' if disable_telemetry else '0' }}"
  tasks:
    - name: Install pmm-client
      ansible.builtin.include_tasks: tasks/install_pmm_client.yml
      when: pmm_enabled | bool

- name: Configure monitoring with PMM
  hosts: cfg:shards:replsets:mongos
  gather_facts: "{{ not (skip_repeated_facts | default(false) | bool) }}"
  become: true
  tags: monitoring
  tasks:
    - name: Wait for the PMM server
      ansible.builtin.import_tasks: tasks/wait_for_pmm_server.yml
      when: pmm_enabled | bool

    - name: Ensure pmm-agent is started
      service:
        name: pmm-agent
        state: started
      when: pmm_enabled | bool

    - name: Point pmm-agent to the PMM server
      shell: pmm-admin config --server-url=https://{{ pmm_server_user }}:{{ pmm_server_pwd }}@{{ hostvars[groups['pmm'][0]].ansible_facts['fqdn'] }}:{{ pmm_external_port }} --server-insecure-tls --force
      register: pmm_config_result
      retries: 3
      delay: 1
      until: pmm_config_result.rc == 0
      when: pmm_enabled | bool

    - name: Add MongoDB metrics collector
      shell: >
        pmm-admin add mongodb
        --environment={{ env_tag }}
        {% if cluster is defined %}
        --cluster {{ cluster }}
        {% endif %}
        --host={{ ansible_facts['fqdn'] }}
        --port={{ mongo_port }}
        --tls-skip-verify
        {% if arbiter is not defined %}
        --username={{ mongodb_pmm_user }} --password='{{ mongodb_pmm_user_pwd }}'
        {% if use_tls | bool %}
        --tls --tls-certificate-key-file={{ certificateKeyFile }} --tls-ca-file={{ CAFile }}
        {% endif %}
        --enable-all-collectors
        {% endif %}
      when: pmm_enabled | bool

    - name: Add mongot metrics collector
      uri:
        url: "http://127.0.0.1:{{ mongot_metrics_port }}/metrics"
        method: GET
        status_code: 200
      register: mongot_metrics_health
      until: mongot_metrics_health.status == 200
      retries: 12
      delay: 5
      when:
        - pmm_enabled | bool
        - enable_mongot_effective | bool
        - arbiter is not defined
        - "'shards' in group_names or 'replsets' in group_names"

- name: Install PMM client on hosts without MongoDB
  hosts: pmm_bare_client
  gather_facts: "{{ not (skip_repeated_facts | default(false) | bool) }}"
  become: true
  tags: install,monitoring
  environment:
    PERCONA_TELEMETRY_DISABLE: "{{ '1' if disable_telemetry else '0' }}"
  tasks:
    - name: Install pmm-client
      ansible.builtin.include_tasks: tasks/install_bare_pmm_client.yml

- name: Configure monitoring on hosts without MongoDB
  hosts: pmm_bare_client
  gather_facts: "{{ not (skip_repeated_facts | default(false) | bool) }}"
  become: true
  tags: monitoring
  tasks:
    - name: Register with the PMM server
      ansible.builtin.include_tasks: tasks/register_bare_pmm_client.yml

# Service hosts (plgm, SeaweedFS, LDAP, Vault, CA, NFS) only report OS metrics.
# These plays must not carry the plgm, seaweedfs or vault tags: the UI skips
# those tags on most runs, but every run has to register its service hosts.
- name: Select service hosts to monitor with PMM
  hosts: all
  gather_facts: false
  tags: install,monitoring
  tasks:
    - name: Group service hosts without MongoDB
      ansible.builtin.import_tasks: tasks/select_pmm_service_hosts.yml

- name: Install PMM client on service hosts
  hosts: pmm_service_hosts
  gather_facts: "{{ not (skip_repeated_facts | default(false) | bool) }}"
  become: true
  tags: install,monitoring
  environment:
    PERCONA_TELEMETRY_DISABLE: "{{ '1' if disable_telemetry else '0' }}"
  tasks:
    - name: Install pmm-client
      ansible.builtin.include_tasks: tasks/install_bare_pmm_client.yml

- name: Configure monitoring on service hosts
  hosts: pmm_service_hosts
  gather_facts: "{{ not (skip_repeated_facts | default(false) | bool) }}"
  become: true
  tags: monitoring
  tasks:
    - name: Register with the PMM server
      ansible.builtin.include_tasks: tasks/register_bare_pmm_client.yml

- name: Install PMM client on PCSM
  hosts: pcsm
  gather_facts: "{{ not (skip_repeated_facts | default(false) | bool) }}"
  become: true
  tags: install,monitoring
  vars:
    pcsm_pmm_service_name: "{{ inventory_hostname }}-pcsm"
  environment:
    PERCONA_TELEMETRY_DISABLE: "{{ '1' if disable_telemetry else '0' }}"
  tasks:
    - name: Install percona-release for PMM client
      ansible.builtin.apt:
        deb: https://repo.percona.com/apt/percona-release_latest.generic_all.deb
        state: present
      when:
        - pmm_enabled | bool
        - ansible_facts['os_family'] == 'Debian'

    - name: Install percona-release for PMM client on Red Hat
      ansible.builtin.dnf:
        name: https://repo.percona.com/yum/percona-release-latest.noarch.rpm
        state: present
        disable_gpg_check: true
      when:
        - pmm_enabled | bool
        - ansible_facts['os_family'] == 'RedHat'

    - name: Enable PMM client repository on PCSM
      ansible.builtin.command: "/usr/bin/percona-release enable {{ pmm_client_repo | default('pmm3-client') }}"
      changed_when: false
      when: pmm_enabled | bool

    - name: Install PMM client on PCSM
      ansible.builtin.package:
        name: "{{ pmm_client_package }}"
        state: present
      when: pmm_enabled | bool

    - name: Disable Percona telemetry on PCSM
      ansible.builtin.include_tasks: tasks/disable_telemetry.yml
      when: pmm_enabled | bool

    - name: Ensure pmm-agent is started on PCSM
      ansible.builtin.service:
        name: pmm-agent
        state: started
      when: pmm_enabled | bool

    - name: Wait for the PMM server
      ansible.builtin.import_tasks: tasks/wait_for_pmm_server.yml
      when: pmm_enabled | bool

    - name: Point PCSM pmm-agent to the PMM server
      ansible.builtin.shell: >-
        pmm-admin config
        --server-url=https://{{ pmm_server_user }}:{{ pmm_server_pwd }}@{{ hostvars[groups['pmm'][0]].ansible_facts['fqdn'] }}:{{ pmm_external_port }}
        --server-insecure-tls --force
      no_log: true
      register: pcsm_pmm_config_result
      retries: 3
      delay: 1
      until: pcsm_pmm_config_result.rc == 0
      when: pmm_enabled | bool

    - name: Wait for PCSM metrics endpoint
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ pcsm_metrics_port }}/{{ pcsm_metrics_path | regex_replace('^/', '') }}"
        method: GET
        status_code: 200
      register: pcsm_metrics_health
      until: pcsm_metrics_health.status == 200
      retries: 12
      delay: 5
      when: pmm_enabled | bool

    - name: Check whether PCSM is already registered in PMM
      ansible.builtin.shell: "pmm-admin list | grep -F -- '{{ pcsm_pmm_service_name }}'"
      args:
        executable: /bin/bash
      register: pcsm_pmm_service
      changed_when: false
      failed_when: false
      when: pmm_enabled | bool

    - name: Register PCSM metrics with PMM
      ansible.builtin.command: >-
        pmm-admin add external
        --service-name={{ pcsm_pmm_service_name }}
        --listen-port={{ pcsm_metrics_port }}
        --metrics-path={{ pcsm_metrics_path }}
        --scheme={{ pcsm_metrics_scheme }}
      when:
        - pmm_enabled | bool
        - pcsm_pmm_service.rc != 0

    - name: Register mongot metrics collector
      shell: >
        pmm-admin add external
        --service-name={{ inventory_hostname }}-mongot
        --listen-port={{ mongot_metrics_port }}
        --metrics-path=/metrics
        --scheme=http
      when:
        - pmm_enabled | bool
        - enable_mongot_effective | bool
        - arbiter is not defined
        - "'shards' in group_names or 'replsets' in group_names"
