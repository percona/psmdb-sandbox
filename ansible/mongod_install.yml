---
- name: Install MongoDB
  hosts: cfg:shards:replsets:mongos
  # Hosts do not depend on each other here, so mongos routers are prepared
  # while the mongod hosts are still installing.
  strategy: free
  gather_facts: "{{ not (skip_repeated_facts | default(false) | bool) }}"
  become: yes
  tags: install
  environment:
    PERCONA_TELEMETRY_DISABLE: "{{ '1' if disable_telemetry else '0' }}"
  tasks:
    - name: Install mongod
      when: group_names | intersect(['cfg', 'shards', 'replsets']) | length > 0
      block:
        - name: Install mongod packages from repository (latest)
          package:
            name: "{{ mongod_packages }}"
            state: present
            policy_rc_d: "{{ 101 if ansible_facts['os_family'] == 'Debian' and vault_encryption_effective | bool else omit }}"
          when: mongo_version is not defined or mongo_version == ''

        - name: Resolve percona-server-mongodb-tools version for the pinned PSMDB version
          include_tasks: tasks/psmdb_tools_pin.yml
          when:
            - mongo_version is defined and mongo_version != ''
            - mongodb_distribution_effective == 'psmdb'

        - name: Install mongod packages from repository (specific version – Debian/Ubuntu)
          apt:
            name: "{{ (mongod_versioned_packages | map('regex_replace', '^(percona-server-mongodb(?:-mongos|-server)?|mongodb-org|mongodb-org-database|mongodb-org-server|mongodb-org-mongos|mongodb-org-tools|mongodb-enterprise|mongodb-enterprise-database|mongodb-enterprise-server|mongodb-enterprise-mongos|mongodb-enterprise-tools)$', '\\1=' ~ mongo_version ~ '*') | list) + (psmdb_tools_pkg_specs | default([])) }}"
            state: present
            allow_downgrade: true
            policy_rc_d: "{{ 101 if vault_encryption_effective | bool else omit }}"
          when:
            - mongo_version is defined and mongo_version != ''
            - ansible_facts['os_family'] == 'Debian'

        - name: Install mongod packages from repository (specific version – RedHat)
          yum:
            name: "{{ (mongod_versioned_packages | map('regex_replace', '^(percona-server-mongodb(?:-mongos|-server)?|mongodb-org|mongodb-org-database|mongodb-org-server|mongodb-org-mongos|mongodb-org-tools|mongodb-enterprise|mongodb-enterprise-database|mongodb-enterprise-server|mongodb-enterprise-mongos|mongodb-enterprise-tools)$', '\\1-' ~ mongo_version) | list) + (psmdb_tools_pkg_specs | default([])) }}"
            state: present
          when:
            - mongo_version is defined and mongo_version != ''
            - ansible_facts['os_family'] == 'RedHat'

        - name: Disable Percona telemetry
          include_tasks: tasks/disable_telemetry.yml
          when: mongodb_distribution_effective == 'psmdb'

        - name: Grant MongoDB access to its TLS certificate
          file:
            path: "{{ certificateKeyFile }}"
            owner: "{{ mongo_os_user }}"
            group: "{{ mongo_os_group }}"
            mode: "0600"
          when: use_tls | bool

    # mongos is started later by mongos_install.yml, once the config servers are up.
    - name: Install and configure mongos
      import_tasks: tasks/mongos_prepare.yml
      when: "'mongos' in group_names"
      tags: mongos

- name: Prepare the configuration
  hosts: cfg:shards:replsets
  gather_facts: "{{ not (skip_repeated_facts | default(false) | bool) }}"
  tags: bootstrap_rs
  
  tasks:
    - name: Set up shared mongo keyfile 
      become: yes
      copy:
        dest: "{{ keyFile_location }}"
        content: "{{ keyfile_content }}"
        owner: "{{ mongo_os_user }}"
        group: root
        mode: 0600
      when: not use_tls | bool
      notify: restart mongod

    - name: Prepare Vault client and validate encryption mode
      include_tasks: tasks/vault_client.yml
      when: arbiter is not defined

    - name: Copy mongod.conf 
      become: yes
      template:
        src: "{{ mongod_conf_template }}"
        dest: /etc/mongod.conf
        owner: root
        group: root
        mode: 0644
      notify: restart mongod

    - name: Create the MongoDB directories
      become: yes
      file:
        path: "{{ item }}"
        owner: "{{ mongo_os_user }}"
        group: "{{ mongo_os_group }}"
        mode: '0750'
        state: directory
        recurse: yes
      with_items:
        - "{{ mongod_path }}"
        - "{{ mongod_log_path }}"

    - name: Ensure MongoDB log file ownership
      become: yes
      file:
        path: "{{ mongod_log_path }}/mongod.log"
        state: touch
        owner: "{{ mongo_os_user }}"
        group: "{{ mongo_os_group }}"
        mode: '0640'

    - name: Ensure audit log directory exists
      become: yes
      file:
        path: "{{ audit_log_path | dirname }}"
        owner: "{{ mongo_os_user }}"
        group: "{{ mongo_os_group }}"
        mode: '0750'
        state: directory
      when: enable_audit_effective | bool

    - name: Restore SELinux contexts on MongoDB paths
      include_tasks: tasks/selinux_mongo_paths.yml
      vars:
        selinux_mongo_paths: "{{ [mongod_path, mongod_log_path] + ([audit_log_path | dirname] if enable_audit_effective | bool else []) }}"

    - name: Set up keyfile for encryption at rest
      become: yes
      copy:
        dest: "{{ encryption_keyfile }}"
        content: "{{ encryption_key_content }}"
        owner: "{{ mongo_os_user }}"
        group: root
        mode: 0600
      when: keyfile_encryption | bool
      notify: restart mongod

    - name: Ensure mongod is started
      become: yes
      service:
        name: mongod
        state: started
        enabled: yes

    - name: Apply pending mongod restarts
      meta: flush_handlers

    - name: Prepare the init command for replica set
      template:
        src: "{{ rs_init_template }}"
        dest: /tmp/init-rs.js
        mode: 0644
      when: mongodb_primary | default(false)

    - name: Wait for MongoDB port
      include_tasks: tasks/wait_for_mongod.yml

    - name: Initialize replica set
      become: yes
      shell: >
        mongosh {{ mongo_tls_flags }}
        --port {{ mongo_port }}
        --host 127.0.0.1
        --quiet
        --eval 'db.hello().setName || ""'
      register: replica_set_name
      changed_when: false
      when: mongodb_primary | default(false)

    - name: Initialize an uninitialized replica set
      become: yes
      command: >
        mongosh {{ mongo_tls_flags }}
        --port {{ mongo_port }}
        --host 127.0.0.1
        /tmp/init-rs.js
      when:
        - mongodb_primary | default(false)
        - replica_set_name.stdout | trim == ''

    - name: Wait for PRIMARY
      become: yes
      shell: >
        mongosh {{ mongo_tls_flags }}
        --port {{ mongo_port }}
        --host 127.0.0.1
        --quiet
        --eval 'db.hello().isWritablePrimary'
        | grep -q true
      register: primary_check
      retries: 30
      delay: 1
      until: primary_check.rc == 0
      changed_when: false
      when: mongodb_primary | default(false)

  handlers:
    - name: restart mongod
      become: yes
      service:
        name: mongod
        state: restarted

- name: Create the local users & logrotate
  hosts: cfg:shards:replsets
  gather_facts: "{{ not (skip_repeated_facts | default(false) | bool) }}"
  become: yes
  tags: os_conf

  tasks:
    - name: Copy logrotate conf
      template:
        src: templates/logrotate-mongod.conf.j2
        dest: /etc/logrotate.d/mongod
        mode: 0644

    - name: Create MongoDB root user
      shell: >
        mongosh admin {{ mongo_tls_flags }}
        --port {{ mongo_port }}
        --host 127.0.0.1
        --eval 'db.createUser({user:"{{ mongo_admin_user }}",pwd:"{{ mongo_admin_password }}",roles:["root"]})'
      no_log: true
      register: root_user_result
      changed_when: root_user_result.rc == 0
      failed_when: root_user_result.rc != 0 and 'requires authentication' not in root_user_result.stderr
      when: mongodb_primary | default(false)

    - name: Prepare the commands to create the PBM and PMM users and roles
      template:
        src: templates/createUsers.js.j2
        dest: /tmp/createUsers.js
        mode: 0644
      when: mongodb_primary | default(false)

    - name: Create PBM and PMM users
      shell: >
        mongosh admin {{ mongo_tls_flags }}
        -u {{ mongo_admin_user }}
        -p {{ mongo_admin_password }}
        --port {{ mongo_port }}
        --host {{ ansible_facts['fqdn'] }}
        < /tmp/createUsers.js
      no_log: true
      when: mongodb_primary | default(false)

    - name: Prepare LDAP external users
      template:
        src: templates/createLdapUsers.js.j2
        dest: /tmp/createLdapUsers.js
        mode: 0600
      when:
        - mongodb_primary | default(false)
        - enable_ldap | default(false) | bool
        - ldap_mongodb_users | default([]) | length > 0

    - name: Create LDAP external users
      shell: >
        mongosh admin {{ mongo_tls_flags }}
        -u {{ mongo_admin_user }}
        -p {{ mongo_admin_password }}
        --port {{ mongo_port }}
        --host {{ ansible_facts['fqdn'] }}
        < /tmp/createLdapUsers.js
      no_log: true
      when:
        - mongodb_primary | default(false)
        - enable_ldap | default(false) | bool
        - ldap_mongodb_users | default([]) | length > 0

    - name: Configure mongo shell alias
      lineinfile:
        path: /etc/profile
        line: >
          alias mongo='mongosh admin {{ mongo_tls_flags }}
          -u {{ mongo_admin_user }}
          -p {{ mongo_admin_password }}
          --port {{ mongo_port }}
          --host {{ ansible_facts['fqdn'] }}'
        state: present
