---
- name: Verify plgm service memory limits
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - ../group_vars/all.yml
  vars:
    plgm_service_user: test-user
    plgm_data_dir: /var/lib/plgm
    plgm_plays: "{{ lookup('file', '../plgm_install.yml') | from_yaml }}"
    plgm_restart_handler: "{{ plgm_plays[0].handlers | selectattr('name', 'equalto', 'Restart plgm') | first }}"
  tasks:
    - name: Verify the restart handler reloads systemd before restarting plgm
      assert:
        that:
          - plgm_restart_handler.systemd.name == 'plgm'
          - plgm_restart_handler.systemd.state == 'restarted'
          - plgm_restart_handler.systemd.daemon_reload | bool

    - name: Verify the default cap reserves host memory and preserves automatic restart
      assert:
        that:
          - plgm_memory_max == '75%'
          - "'MemoryMax=75%\n' in lookup('template', '../templates/plgm.service.j2')"
          - "'Restart=always\n' in lookup('template', '../templates/plgm.service.j2')"
          - "'RestartSec=2\n' in lookup('template', '../templates/plgm.service.j2')"

    - name: Verify absolute memory limits can be supplied
      assert:
        that:
          - "'MemoryMax=6G\n' in lookup('template', '../templates/plgm.service.j2')"
      vars:
        plgm_memory_max: 6G

    - name: Verify percentage limits can be supplied
      assert:
        that:
          - "'MemoryMax=50%\n' in lookup('template', '../templates/plgm.service.j2')"
      vars:
        plgm_memory_max: "50%"

    - name: Verify the cap can be explicitly disabled
      assert:
        that:
          - "'MemoryMax=infinity\n' in lookup('template', '../templates/plgm.service.j2')"
      vars:
        plgm_memory_max: infinity
