---
- name: Validate CA inventory
  hosts: localhost
  gather_facts: false
  become: false
  tasks:
    - name: Require a CA signer
      assert:
        that:
          - groups['ca'] | default([]) | length > 0
        fail_msg: "cert_setup.yml requires at least one host in the ca inventory group"
      run_once: true

- name: Prepare CA
  hosts: ca
  become: true
  vars:
    ca_signer: "{{ groups['ca'] | first }}"
    cert_staging_dir: "{{ ca_staging_dir | default('/tmp/mongo_terraform_ansible/' ~ (cluster | default('default')) ~ '/cert_setup', true) }}"
    client_certificate_id: "{{ ((cluster | default('default')) ~ '-' ~ ansible_user) | regex_replace('[^A-Za-z0-9_.-]', '_') }}"
  tasks:
    - name: Ensure OpenSSL is installed on the CA signer
      package:
        name: openssl
        state: present
      delegate_to: "{{ ca_signer }}"
      run_once: true
      tags:
        - ca
        - create_certs

    - name: Copy CA OpenSSL configuration file
      template:
        src: openssl-test-ca.cnf.j2
        dest: /etc/ssl/openssl-test-ca.cnf
        owner: root
        group: root
        mode: "0644"
      delegate_to: "{{ ca_signer }}"
      run_once: true
      tags: ca

    - name: Generate the CA key file
      command: openssl genrsa -out /etc/ssl/mongodb-test-ca.key 4096
      args:
        creates: /etc/ssl/mongodb-test-ca.key
      delegate_to: "{{ ca_signer }}"
      run_once: true
      tags: ca

    - name: Generate the CA certificate
      command:
        argv:
          - openssl
          - req
          - -new
          - -x509
          - -days
          - "1826"
          - -key
          - /etc/ssl/mongodb-test-ca.key
          - -out
          - /etc/ssl/mongodb-test-ca.crt
          - -config
          - /etc/ssl/openssl-test-ca.cnf
          - -subj
          - "/C=US/ST=California/L=San Francisco/O=MyOrganization/OU=MyDepartment/CN={{ hostvars[ca_signer].ansible_facts['fqdn'] }}"
      args:
        creates: /etc/ssl/mongodb-test-ca.crt
      delegate_to: "{{ ca_signer }}"
      run_once: true
      tags: ca

    - name: Generate the intermediate certificate key
      command: openssl genrsa -out /etc/ssl/mongodb-test-ia.key 4096
      args:
        creates: /etc/ssl/mongodb-test-ia.key
      delegate_to: "{{ ca_signer }}"
      run_once: true
      tags: ca

    - name: Generate the intermediate certificate request
      command:
        argv:
          - openssl
          - req
          - -new
          - -key
          - /etc/ssl/mongodb-test-ia.key
          - -out
          - /etc/ssl/mongodb-test-ia.csr
          - -config
          - /etc/ssl/openssl-test-ca.cnf
          - -subj
          - "/C=US/ST=California/L=San Francisco/O=MyOrganization/OU=MyDepartment/CN={{ hostvars[ca_signer].ansible_facts['fqdn'] }}"
      args:
        creates: /etc/ssl/mongodb-test-ia.csr
      delegate_to: "{{ ca_signer }}"
      run_once: true
      tags: ca

    - name: Generate the intermediate certificate
      command: >-
        openssl x509 -sha256 -req -days 730
        -in /etc/ssl/mongodb-test-ia.csr
        -CA /etc/ssl/mongodb-test-ca.crt
        -CAkey /etc/ssl/mongodb-test-ca.key
        -set_serial 01
        -out /etc/ssl/mongodb-test-ia.crt
        -extfile /etc/ssl/openssl-test-ca.cnf
        -extensions v3_ca
      args:
        creates: /etc/ssl/mongodb-test-ia.crt
      delegate_to: "{{ ca_signer }}"
      run_once: true
      tags: ca

    - name: Create the CA PEM bundle
      shell: >-
        umask 077 && cat /etc/ssl/mongodb-test-ia.crt
        /etc/ssl/mongodb-test-ca.crt > /etc/ssl/test-ca.pem
      args:
        creates: /etc/ssl/test-ca.pem
      delegate_to: "{{ ca_signer }}"
      run_once: true
      tags: ca

    - name: Set CA file permissions
      file:
        path: "{{ item.path }}"
        owner: root
        group: root
        mode: "{{ item.mode }}"
      loop:
        - { path: /etc/ssl/mongodb-test-ca.key, mode: "0600" }
        - { path: /etc/ssl/mongodb-test-ca.crt, mode: "0644" }
        - { path: /etc/ssl/mongodb-test-ia.key, mode: "0600" }
        - { path: /etc/ssl/mongodb-test-ia.csr, mode: "0644" }
        - { path: /etc/ssl/mongodb-test-ia.crt, mode: "0644" }
        - { path: /etc/ssl/test-ca.pem, mode: "0644" }
      delegate_to: "{{ ca_signer }}"
      run_once: true
      tags: ca

    - name: Create namespaced certificate staging directory on controller
      file:
        path: "{{ cert_staging_dir }}"
        state: directory
        mode: "0700"
      delegate_to: localhost
      become: false
      run_once: true
      tags: copy_certs

    - name: Fetch CA PEM bundle to controller
      fetch:
        src: /etc/ssl/test-ca.pem
        dest: "{{ cert_staging_dir }}/test-ca.pem"
        flat: true
      delegate_to: "{{ ca_signer }}"
      run_once: true
      tags: copy_certs

    - name: Restrict staged CA bundle permissions
      file:
        path: "{{ cert_staging_dir }}/test-ca.pem"
        mode: "0600"
      delegate_to: localhost
      become: false
      run_once: true
      tags: copy_certs

    - name: Copy client OpenSSL configuration file
      template:
        src: openssl-test-client.cnf.j2
        dest: "/etc/ssl/openssl-test-client-{{ client_certificate_id }}.cnf"
        owner: root
        group: root
        mode: "0644"
      run_once: true
      tags: create_certs

    - name: Generate the client key file
      command: "openssl genrsa -out /etc/ssl/mongodb-client-{{ client_certificate_id }}.key 4096"
      args:
        creates: "/etc/ssl/mongodb-client-{{ client_certificate_id }}.key"
      run_once: true
      tags: create_certs

    - name: Generate the client certificate request
      command:
        argv:
          - openssl
          - req
          - -new
          - -key
          - "/etc/ssl/mongodb-client-{{ client_certificate_id }}.key"
          - -out
          - "/etc/ssl/mongodb-client-{{ client_certificate_id }}.csr"
          - -config
          - "/etc/ssl/openssl-test-client-{{ client_certificate_id }}.cnf"
          - -subj
          - "/C=US/O=MongoDB Automation/OU=Provisioning/CN={{ client_certificate_id }}"
      args:
        creates: "/etc/ssl/mongodb-client-{{ client_certificate_id }}.csr"
      run_once: true
      tags: create_certs

    - name: Generate the client certificate
      command: >-
        openssl x509 -sha256 -req -days 365
        -in /etc/ssl/mongodb-client-{{ client_certificate_id }}.csr
        -CA /etc/ssl/mongodb-test-ia.crt
        -CAkey /etc/ssl/mongodb-test-ia.key
        -CAcreateserial
        -out /etc/ssl/mongodb-client-{{ client_certificate_id }}.crt
        -extfile /etc/ssl/openssl-test-client-{{ client_certificate_id }}.cnf
        -extensions v3_req
      args:
        creates: "/etc/ssl/mongodb-client-{{ client_certificate_id }}.crt"
      run_once: true
      tags: create_certs

    - name: Generate the client PEM file
      shell: >-
        umask 077 && cat /etc/ssl/mongodb-client-{{ client_certificate_id }}.crt
        /etc/ssl/mongodb-client-{{ client_certificate_id }}.key
        > /etc/ssl/mongodb-client-{{ client_certificate_id }}.pem
      args:
        creates: "/etc/ssl/mongodb-client-{{ client_certificate_id }}.pem"
      run_once: true
      tags: create_certs

    - name: Set client certificate file permissions on signer
      file:
        path: "{{ item.path }}"
        owner: root
        group: root
        mode: "{{ item.mode }}"
      loop:
        - { path: "/etc/ssl/mongodb-client-{{ client_certificate_id }}.key", mode: "0600" }
        - { path: "/etc/ssl/mongodb-client-{{ client_certificate_id }}.csr", mode: "0644" }
        - { path: "/etc/ssl/mongodb-client-{{ client_certificate_id }}.crt", mode: "0644" }
        - { path: "/etc/ssl/mongodb-client-{{ client_certificate_id }}.pem", mode: "0600" }
      run_once: true
      tags: create_certs

    - name: Fetch client PEM file to controller
      fetch:
        src: "/etc/ssl/mongodb-client-{{ client_certificate_id }}.pem"
        dest: "{{ cert_staging_dir }}/client.pem"
        flat: true
      run_once: true
      tags: copy_certs

    - name: Restrict staged client PEM permissions
      file:
        path: "{{ cert_staging_dir }}/client.pem"
        mode: "0600"
      delegate_to: localhost
      become: false
      run_once: true
      tags: copy_certs

- name: Prepare server certificates
  hosts: cfg:shards:replsets:mongos:pcsm
  become: true
  vars:
    ca_signer: "{{ groups['ca'] | first }}"
    certificate_id: "{{ inventory_hostname | regex_replace('[^A-Za-z0-9_.-]', '_') }}"
    cert_staging_dir: "{{ ca_staging_dir | default('/tmp/mongo_terraform_ansible/' ~ (cluster | default('default')) ~ '/cert_setup', true) }}"
  tasks:
    - name: Copy server OpenSSL configuration file to signer
      template:
        src: openssl-test-server.cnf.j2
        dest: "/etc/ssl/openssl-test-server-{{ certificate_id }}.cnf"
        owner: root
        group: root
        mode: "0644"
      delegate_to: "{{ ca_signer }}"
      tags: create_certs

    - name: Generate the server key file
      command: "openssl genrsa -out /etc/ssl/mongodb-{{ certificate_id }}.key 4096"
      args:
        creates: "/etc/ssl/mongodb-{{ certificate_id }}.key"
      delegate_to: "{{ ca_signer }}"
      tags: create_certs

    - name: Generate the server certificate request
      command:
        argv:
          - openssl
          - req
          - -new
          - -key
          - "/etc/ssl/mongodb-{{ certificate_id }}.key"
          - -out
          - "/etc/ssl/mongodb-{{ certificate_id }}.csr"
          - -config
          - "/etc/ssl/openssl-test-server-{{ certificate_id }}.cnf"
          - -subj
          - "/C=US/ST=California/L=San Francisco/O=MyOrganization/OU=MyDepartment/CN={{ ansible_facts['fqdn'] }}"
      args:
        creates: "/etc/ssl/mongodb-{{ certificate_id }}.csr"
      delegate_to: "{{ ca_signer }}"
      tags: create_certs

    - name: Generate the server certificate
      command: >-
        openssl x509 -sha256 -req -days 365
        -in /etc/ssl/mongodb-{{ certificate_id }}.csr
        -CA /etc/ssl/mongodb-test-ia.crt
        -CAkey /etc/ssl/mongodb-test-ia.key
        -CAcreateserial
        -out /etc/ssl/mongodb-{{ certificate_id }}.crt
        -extfile /etc/ssl/openssl-test-server-{{ certificate_id }}.cnf
        -extensions v3_req
      args:
        creates: "/etc/ssl/mongodb-{{ certificate_id }}.crt"
      delegate_to: "{{ ca_signer }}"
      throttle: 1
      tags: create_certs

    - name: Generate the server PEM file
      shell: >-
        umask 077 && cat /etc/ssl/mongodb-{{ certificate_id }}.crt
        /etc/ssl/mongodb-{{ certificate_id }}.key
        > /etc/ssl/mongodb-{{ certificate_id }}.pem
      args:
        creates: "/etc/ssl/mongodb-{{ certificate_id }}.pem"
      delegate_to: "{{ ca_signer }}"
      tags: create_certs

    - name: Set server certificate file permissions on signer
      file:
        path: "{{ item.path }}"
        owner: root
        group: root
        mode: "{{ item.mode }}"
      loop:
        - { path: "/etc/ssl/mongodb-{{ certificate_id }}.key", mode: "0600" }
        - { path: "/etc/ssl/mongodb-{{ certificate_id }}.csr", mode: "0644" }
        - { path: "/etc/ssl/mongodb-{{ certificate_id }}.crt", mode: "0644" }
        - { path: "/etc/ssl/mongodb-{{ certificate_id }}.pem", mode: "0600" }
      delegate_to: "{{ ca_signer }}"
      tags: create_certs

    - name: Fetch server PEM file to controller
      fetch:
        src: "/etc/ssl/mongodb-{{ certificate_id }}.pem"
        dest: "{{ cert_staging_dir }}/mongodb-{{ certificate_id }}.pem"
        flat: true
      delegate_to: "{{ ca_signer }}"
      tags: copy_certs

    - name: Restrict staged server PEM permissions
      file:
        path: "{{ cert_staging_dir }}/mongodb-{{ certificate_id }}.pem"
        mode: "0600"
      delegate_to: localhost
      become: false
      tags: copy_certs

    - name: Copy CA PEM file to server
      copy:
        src: "{{ cert_staging_dir }}/test-ca.pem"
        dest: "{{ CAFile }}"
        owner: root
        group: root
        mode: "0644"
      tags: copy_certs

    - name: Copy client PEM file to server
      copy:
        src: "{{ cert_staging_dir }}/client.pem"
        dest: "{{ clientCertificateKeyFile }}"
        owner: "{{ ansible_user }}"
        mode: "0600"
      tags: copy_certs

    - name: Copy server PEM file to server
      copy:
        src: "{{ cert_staging_dir }}/mongodb-{{ certificate_id }}.pem"
        dest: "{{ certificateKeyFile }}"
        owner: root
        group: root
        mode: "0600"
      tags: copy_certs

- name: Distribute client certificates to the load generator
  hosts: plgm
  become: true
  vars:
    cert_staging_dir: "{{ ca_staging_dir | default('/tmp/mongo_terraform_ansible/' ~ (cluster | default('default')) ~ '/cert_setup', true) }}"
  tasks:
    - name: Copy CA PEM file to load generator
      copy:
        src: "{{ cert_staging_dir }}/test-ca.pem"
        dest: "{{ CAFile }}"
        owner: root
        group: root
        mode: "0644"
      tags: copy_certs

    - name: Copy client PEM file to load generator
      copy:
        src: "{{ cert_staging_dir }}/client.pem"
        dest: "{{ clientCertificateKeyFile }}"
        owner: "{{ ansible_user }}"
        mode: "0600"
      tags: copy_certs
