---
- name: Prepare nodes
  tags: os_conf,install,backup,monitoring
  hosts: cfg:shards:replsets:mongos
  gather_facts: "{{ not (skip_repeated_facts | default(false) | bool) }}"
  become: yes
  environment:
    PERCONA_TELEMETRY_DISABLE: "{{ '1' if disable_telemetry else '0' }}"
  tasks:
    - name: Validate Vault encryption support
      assert:
        that:
          - not (vault_encryption_effective | bool) or mongodb_distribution_effective == 'psmdb'
          - not (vault_encryption_effective | bool and keyfile_encryption | bool)
        fail_msg: "Vault encryption requires PSMDB and cannot be combined with local-keyfile encryption."

    - name: Validate MongoDB integration compatibility
      include_tasks: tasks/mongodb_compatibility.yml

    - name: Validate MongoDB distribution
      assert:
        that:
          - mongodb_distribution_effective in ['psmdb', 'community', 'enterprise']
        fail_msg: "mongodb_distribution must be one of: psmdb, community, enterprise"

    - name: Validate MongoDB release matches distribution
      assert:
        that:
          - mongodb_distribution_effective != 'psmdb' or mongo_release_effective is match('^psmdb-')
          - mongodb_distribution_effective == 'psmdb' or mongo_release_effective is not match('^psmdb-')
        fail_msg: "mongo_release must be psmdb-* for mongodb_distribution=psmdb, and a numeric official release line (for example 8.0 or 8.3) for mongodb_distribution=community or enterprise."

    - name: Validate MongoDB 7.0 repository availability on Ubuntu
      ansible.builtin.assert:
        that:
          - not (ansible_facts['distribution'] == 'Ubuntu' and ansible_facts['distribution_release'] == 'noble' and mongodb_distribution_effective in ['community', 'enterprise'] and mongo_release_effective == '7.0')
        fail_msg: "MongoDB {{ mongodb_distribution_effective }} 7.0 has no Ubuntu 24.04 (noble) repository. Provision Ubuntu 22.04 (jammy) or another supported OS."

    - name: Validate MongoDB Community feature compatibility
      assert:
        that:
          - not (enable_audit | default(false) | bool)
          - not (keyfile_encryption | default(false) | bool)
          - not (vault_encryption_effective | bool)
        fail_msg: "MongoDB Community packages do not support audit logging or encryption at rest. Use psmdb/enterprise or disable those features."
      when: mongodb_distribution_effective == 'community'

    - name: Validate MongoDB LDAP feature compatibility
      assert:
        that:
          - mongodb_distribution_effective in ['psmdb', 'enterprise']
        fail_msg: "LDAP authentication requires Percona Server for MongoDB or MongoDB Enterprise; MongoDB Community is not supported."
      when: enable_ldap | default(false) | bool

    - name: Validate Percona Search compatibility
      assert:
        that:
          - mongodb_distribution_effective == 'psmdb'
          - mongo_release_effective == 'psmdb-83'
          - mongot_repo_effective in ['release', 'testing', 'experimental']
        fail_msg: "Percona Search requires mongodb_distribution=psmdb, mongo_release=psmdb-83, and mongot_repo=release, testing, or experimental. Use mongot_source=community_tarball for other MongoDB releases."
      when: percona_search_effective | bool

    - name: Load OS-specific variables
      include_vars: "vars/{{ ansible_facts['os_family'] }}.yml"

    - name: Install percona release for Ubuntu
      block:

        - name: Install dependencies for percona-release
          ansible.builtin.apt:
            name:
              - curl
              - gnupg2
              - lsb-release
              # PMM Extensions tasks run Python in a venv, which Debian ships separately
              - python3-venv
            state: present
            update_cache: yes
            cache_valid_time: 3600

        - name: Download percona-release package
          ansible.builtin.get_url:
            url: https://repo.percona.com/apt/percona-release_latest.generic_all.deb
            dest: /tmp/percona-release_latest.deb
            mode: "666"

        - name: Install percona-release package
          ansible.builtin.apt:
            deb: /tmp/percona-release_latest.deb
            state: present

      when:
        - ansible_facts['os_family'] == 'Debian'

    - name: Install percona release for RedHat
      block:
        
        - name: Install Percona GPG key
          rpm_key:
            key: "{{ percona_key_location }}"
            state: present

        - name: Install percona-release package 
          package:
            name: "{{ percona_release_package }}"
            state: present    

      when:
        - ansible_facts['os_family'] == 'RedHat'

    - name: Configure official MongoDB repository for Debian/Ubuntu
      block:
        - name: Install dependencies for MongoDB repository
          ansible.builtin.apt:
            name:
              - curl
              - gnupg
            state: present
            update_cache: yes
            cache_valid_time: 3600

        - name: Add official MongoDB GPG key
          ansible.builtin.apt_key:
            url: "https://pgp.mongodb.com/server-{{ mongodb_repo_signing_key }}.asc"
            state: present

        - name: Configure official MongoDB apt repository
          ansible.builtin.apt_repository:
            repo: "deb [ arch=amd64,arm64 ] https://{{ mongodb_repo_host }}/apt/{{ ansible_facts['distribution'] | lower }} {{ ansible_facts['distribution_release'] }}/{{ mongodb_repo_product }}/{{ mongodb_repo_line }} {{ mongodb_apt_component }}"
            filename: "{{ mongodb_repo_product }}-{{ mongodb_repo_line }}"
            state: present
      when:
        - ansible_facts['os_family'] == 'Debian'
        - mongodb_distribution_effective in ['community', 'enterprise']

    - name: Configure official MongoDB repository for RedHat
      ansible.builtin.yum_repository:
        name: "{{ mongodb_repo_product }}-{{ mongodb_repo_line }}"
        description: "MongoDB {{ mongodb_distribution_effective }} Repository"
        baseurl: "https://{{ mongodb_repo_host }}/yum/redhat/{{ ansible_facts['distribution_major_version'] }}/{{ mongodb_repo_product }}/{{ mongodb_repo_line }}/$basearch/"
        gpgcheck: yes
        enabled: yes
        gpgkey: "https://pgp.mongodb.com/server-{{ mongodb_repo_signing_key }}.asc"
      when:
        - ansible_facts['os_family'] == 'RedHat'
        - mongodb_distribution_effective in ['community', 'enterprise']

    - name: Enable MongoDB repository
      command: "/usr/bin/percona-release enable {{ mongo_release_effective }} {{ mongo_repo_effective }}"
      when: mongodb_distribution_effective == 'psmdb'

    - name: Enable Percona Search repository
      command: "/usr/bin/percona-release enable ps4m {{ mongot_repo_effective }}"
      when:
        - percona_search_effective | bool
        - "'shards' in group_names or 'replsets' in group_names"

    - name: Enable PBM repository
      command: "/usr/bin/percona-release enable pbm {{ pbm_repo | default('release') }}"
      when:
        - pbm_enabled | bool
        - "'cfg' in group_names or 'shards' in group_names or 'replsets' in group_names"

    - name: Enable PMM client repository
      command: "/usr/bin/percona-release enable {{ pmm_client_repo | default('pmm3-client') }}"
      when: pmm_enabled | bool

    - name: Refresh apt package cache after repository setup
      ansible.builtin.apt:
        update_cache: yes
        cache_valid_time: 3600
      when: ansible_facts['os_family'] == 'Debian'
