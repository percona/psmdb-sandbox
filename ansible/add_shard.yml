---
- import_playbook: vault_server.yml

- name: Add a new shard replica set to an existing sharded cluster
  hosts: "{{ new_shard_group }}"
  become: yes
  tags: add_shard
  environment:
    PERCONA_TELEMETRY_DISABLE: "{{ '1' if disable_telemetry else '0' }}"

  vars:
    mongodb_repo_line: "{{ mongo_release_effective if mongodb_distribution_effective != 'psmdb' else '' }}"
    mongodb_repo_product: "{{ 'mongodb-org' if mongodb_distribution_effective == 'community' else 'mongodb-enterprise' }}"
    mongodb_repo_host: "{{ 'repo.mongodb.org' if mongodb_distribution_effective == 'community' else 'repo.mongodb.com' }}"
    mongo_tls_flags: >-
      {% if use_tls | bool %}
      --tls
      --tlsCertificateKeyFile {{ clientCertificateKeyFile }}
      --tlsCAFile {{ CAFile }}
      --tlsAllowInvalidCertificates
      {% endif %}

  tasks:
    - name: Validate MongoDB integration compatibility
      include_tasks: tasks/mongodb_compatibility.yml

    - name: Validate MongoDB distribution
      assert:
        that:
          - mongodb_distribution_effective in ['psmdb', 'community', 'enterprise']
        fail_msg: "mongodb_distribution must be one of: psmdb, community, enterprise"

    - name: Validate MongoDB release matches distribution
      assert:
        that:
          - mongodb_distribution_effective != 'psmdb' or mongo_release_effective is match('^psmdb-')
          - mongodb_distribution_effective == 'psmdb' or mongo_release_effective is not match('^psmdb-')
        fail_msg: "mongo_release must be psmdb-* for mongodb_distribution=psmdb, and a numeric official release line (for example 8.0 or 8.3) for mongodb_distribution=community or enterprise."

    - name: Validate MongoDB Community feature compatibility
      assert:
        that:
          - not (enable_audit | default(false) | bool)
          - not (keyfile_encryption | default(false) | bool)
          - not (vault_encryption_effective | bool)
        fail_msg: "MongoDB Community packages do not support audit logging or encryption at rest. Use psmdb/enterprise or disable those features."
      when: mongodb_distribution_effective == 'community'

    - name: Load OS-specific variables
      include_vars: "vars/{{ ansible_facts['os_family'] }}.yml"

    - name: Install percona release for Ubuntu
      block:
        - name: Install dependencies for percona-release
          ansible.builtin.apt:
            name:
              - curl
              - gnupg2
              - lsb-release
            state: present
            update_cache: yes

        - name: Download percona-release package
          ansible.builtin.get_url:
            url: https://repo.percona.com/apt/percona-release_latest.generic_all.deb
            dest: /tmp/percona-release_latest.deb
            mode: "0666"

        - name: Install percona-release package
          ansible.builtin.apt:
            deb: /tmp/percona-release_latest.deb
            state: present

        - name: Update apt package cache
          ansible.builtin.apt:
            update_cache: yes
      when:
        - ansible_facts['os_family'] == 'Debian'
        - mongodb_distribution_effective == 'psmdb'

    - name: Install percona release for RedHat
      block:
        - name: Install Percona GPG key
          rpm_key:
            key: "{{ percona_key_location }}"
            state: present

        - name: Install percona-release package
          package:
            name: "{{ percona_release_package }}"
            state: present
      when:
        - ansible_facts['os_family'] == 'RedHat'
        - mongodb_distribution_effective == 'psmdb'

    - name: Configure official MongoDB repository for Debian/Ubuntu
      block:
        - name: Install dependencies for MongoDB repository
          ansible.builtin.apt:
            name:
              - curl
              - gnupg
            state: present
            update_cache: yes

        - name: Add official MongoDB GPG key
          ansible.builtin.apt_key:
            url: "https://pgp.mongodb.com/server-{{ mongodb_repo_signing_key }}.asc"
            state: present

        - name: Configure official MongoDB apt repository
          ansible.builtin.apt_repository:
            repo: "deb [ arch=amd64,arm64 ] https://{{ mongodb_repo_host }}/apt/{{ ansible_facts['distribution'] | lower }} {{ ansible_facts['distribution_release'] }}/{{ mongodb_repo_product }}/{{ mongodb_repo_line }} {{ mongodb_apt_component }}"
            filename: "{{ mongodb_repo_product }}-{{ mongodb_repo_line }}"
            state: present
      when:
        - ansible_facts['os_family'] == 'Debian'
        - mongodb_distribution_effective in ['community', 'enterprise']

    - name: Configure official MongoDB repository for RedHat
      ansible.builtin.yum_repository:
        name: "{{ mongodb_repo_product }}-{{ mongodb_repo_line }}"
        description: "MongoDB {{ mongodb_distribution_effective }} Repository"
        baseurl: "https://{{ mongodb_repo_host }}/yum/redhat/{{ ansible_facts['distribution_major_version'] }}/{{ mongodb_repo_product }}/{{ mongodb_repo_line }}/$basearch/"
        gpgcheck: yes
        enabled: yes
        gpgkey: "https://pgp.mongodb.com/server-{{ mongodb_repo_signing_key }}.asc"
      when:
        - ansible_facts['os_family'] == 'RedHat'
        - mongodb_distribution_effective in ['community', 'enterprise']

    - name: Enable the specific MongoDB version
      shell: "/usr/bin/percona-release enable {{ mongo_release_effective }} {{ mongo_repo_effective }}"
      when: mongodb_distribution_effective == 'psmdb'

    - name: Install mongod packages from repository (latest)
      package:
        name: "{{ mongod_packages }}"
        state: present
        policy_rc_d: "{{ 101 if ansible_facts['os_family'] == 'Debian' and vault_encryption_effective | bool else omit }}"
      when: mongo_version is not defined or mongo_version == ''

    - name: Resolve percona-server-mongodb-tools version for the pinned PSMDB version
      include_tasks: tasks/psmdb_tools_pin.yml
      when:
        - mongo_version is defined and mongo_version != ''
        - mongodb_distribution_effective == 'psmdb'

    - name: Install mongod packages from repository (specific version - Debian/Ubuntu)
      apt:
        name: "{{ (mongod_versioned_packages | map('regex_replace', '^(percona-server-mongodb(?:-mongos|-server)?|mongodb-org|mongodb-org-database|mongodb-org-server|mongodb-org-mongos|mongodb-org-tools|mongodb-enterprise|mongodb-enterprise-database|mongodb-enterprise-server|mongodb-enterprise-mongos|mongodb-enterprise-tools)$', '\\1=' ~ mongo_version ~ '*') | list) + (psmdb_tools_pkg_specs | default([])) }}"
        state: present
        allow_downgrade: true
        policy_rc_d: "{{ 101 if vault_encryption_effective | bool else omit }}"
      when:
        - mongo_version is defined and mongo_version != ''
        - ansible_facts['os_family'] == 'Debian'

    - name: Install mongod packages from repository (specific version - RedHat)
      yum:
        name: "{{ (mongod_versioned_packages | map('regex_replace', '^(percona-server-mongodb(?:-mongos|-server)?|mongodb-org|mongodb-org-database|mongodb-org-server|mongodb-org-mongos|mongodb-org-tools|mongodb-enterprise|mongodb-enterprise-database|mongodb-enterprise-server|mongodb-enterprise-mongos|mongodb-enterprise-tools)$', '\\1-' ~ mongo_version) | list) + (psmdb_tools_pkg_specs | default([])) }}"
        state: present
      when:
        - mongo_version is defined and mongo_version != ''
        - ansible_facts['os_family'] == 'RedHat'

    - name: Disable Percona telemetry
      systemd:
        name: percona-telemetry-agent
        enabled: false
        state: stopped
        daemon_reload: yes
      ignore_errors: true
      when:
        - disable_telemetry | bool
        - mongodb_distribution_effective == 'psmdb'

    - name: Grant MongoDB access to its TLS certificate
      file:
        path: "{{ certificateKeyFile }}"
        owner: "{{ mongo_os_user }}"
        group: "{{ mongo_os_group }}"
        mode: "0600"
      when: use_tls | bool

    - name: Set up shared mongo keyfile
      copy:
        dest: "{{ keyFile_location }}"
        content: "{{ keyfile_content }}"
        owner: "{{ mongo_os_user }}"
        group: root
        mode: "0600"
      when: not use_tls | bool

    - name: Prepare Vault client and validate encryption mode
      include_tasks: tasks/vault_client.yml
      when: arbiter is not defined

    - name: Copy mongod.conf
      template:
        src: "{{ mongod_conf_template }}"
        dest: /etc/mongod.conf
        owner: root
        group: root
        mode: "0644"

    - name: Create the MongoDB directories
      file:
        path: "{{ item }}"
        owner: "{{ mongo_os_user }}"
        group: "{{ mongo_os_group }}"
        mode: "0750"
        state: directory
      with_items:
        - "{{ mongod_path }}"
        - "{{ mongod_log_path }}"

    - name: Ensure audit log directory exists
      file:
        path: "{{ audit_log_path | dirname }}"
        owner: "{{ mongo_os_user }}"
        group: "{{ mongo_os_group }}"
        mode: "0750"
        state: directory
      when: enable_audit_effective | bool

    - name: Restore SELinux contexts on MongoDB paths
      include_tasks: tasks/selinux_mongo_paths.yml
      vars:
        selinux_mongo_paths: "{{ [mongod_path, mongod_log_path] + ([audit_log_path | dirname] if enable_audit_effective | bool else []) }}"

    - name: Set up keyfile for encryption at rest
      copy:
        dest: "{{ encryption_keyfile }}"
        content: "{{ encryption_key_content }}"
        owner: "{{ mongo_os_user }}"
        group: root
        mode: "0600"
      when: keyfile_encryption | bool

    - name: Start mongod on new shard member
      service:
        name: mongod
        state: restarted

    - name: Prepare the init command for new shard replica set
      template:
        src: "{{ rs_init_template }}"
        dest: /tmp/init-rs.js
        mode: "0644"
      when: mongodb_primary | default(false)

    - name: Wait for MongoDB port
      block:
        - name: Wait for MongoDB port
          wait_for:
            host: 127.0.0.1
            port: "{{ mongo_port }}"
            delay: 1
            timeout: 60
      rescue:
        - name: Collect mongod startup diagnostics
          shell: systemctl status mongod --no-pager -l; journalctl -u mongod --no-pager -n 50
          register: mongod_diagnostics
          changed_when: false
          failed_when: false

        - name: Report mongod startup failure
          fail:
            msg: "mongod is not listening on port {{ mongo_port }}:\n{{ mongod_diagnostics.stdout }}"

    - name: Check whether the new shard replica set is already initialized
      shell: >
        mongosh {{ mongo_tls_flags }}
        --port {{ mongo_port }}
        --host 127.0.0.1
        --quiet
        --eval 'try { rs.status().ok } catch(e) { 0 }'
      register: shard_rs_status
      changed_when: false
      when: mongodb_primary | default(false)

    - name: Initialize new shard replica set
      command: >
        mongosh {{ mongo_tls_flags }}
        --port {{ mongo_port }}
        --host 127.0.0.1
        /tmp/init-rs.js
      when:
        - mongodb_primary | default(false)
        - shard_rs_status.stdout != '1'

    - name: Wait for PRIMARY
      shell: >
        mongosh admin {{ mongo_tls_flags }}
        --port {{ mongo_port }}
        --host 127.0.0.1
        --quiet
        --eval 'rs.status().members.filter(m => m.stateStr=="PRIMARY").length'
        | grep -q 1
      register: primary_check
      retries: 30
      delay: 1
      until: primary_check.rc == 0
      changed_when: false
      when: mongodb_primary | default(false)

    - name: Create MongoDB root user
      shell: >
        mongosh admin {{ mongo_tls_flags }}
        --port {{ mongo_port }}
        --host 127.0.0.1
        --eval 'db.createUser({user:"{{ mongo_admin_user }}",pwd:"{{ mongo_admin_password }}",roles:["root"]})'
      no_log: true
      when: mongodb_primary | default(false)

    - name: Prepare the commands to create the PBM and PMM users and roles
      template:
        src: templates/createUsers.js.j2
        dest: /tmp/createUsers.js
        mode: "0644"
      when: mongodb_primary | default(false)

    - name: Create PBM and PMM users
      shell: >
        mongosh admin {{ mongo_tls_flags }}
        -u {{ mongo_admin_user }}
        -p {{ mongo_admin_password }}
        --port {{ mongo_port }}
        --host {{ ansible_facts['fqdn'] }}
        < /tmp/createUsers.js
      no_log: true
      ignore_errors: true
      when: mongodb_primary | default(false)

    - name: Configure mongo shell alias
      lineinfile:
        path: /etc/profile
        line: >
          alias mongo='mongosh admin {{ mongo_tls_flags }}
          -u {{ mongo_admin_user }}
          -p {{ mongo_admin_password }}
          --port {{ mongo_port }}
          --host {{ ansible_facts['fqdn'] }}'
        state: present

- name: Register the new shard with mongos
  hosts: "{{ new_shard_group }}"
  tags: add_shard
  vars:
    mongo_tls_flags: >-
      {% if use_tls | bool %}
      --tls
      --tlsCertificateKeyFile {{ clientCertificateKeyFile }}
      --tlsCAFile {{ CAFile }}
      --tlsAllowInvalidCertificates
      {% endif %}
  tasks:
    - name: Add new shard to the cluster if needed
      shell: |
        mongosh admin {{ mongo_tls_flags }} -u {{ mongo_admin_user }} -p {{ mongo_admin_password }} --port {{ mongos_port }} --host {{ groups.mongos | first }} --eval '
          const shardName = "{{ cluster }}-{{ group_names[0] }}";
          const shardConn = shardName + "/{{ ansible_facts["fqdn"] }}:{{ mongo_port }}";
          if (!db.adminCommand({ listShards: 1 }).shards.some(s => s._id === shardName)) {
            sh.addShard(shardConn);
          } else {
            print("Shard " + shardName + " is already registered, skipping.");
          }
        '
      no_log: true
      delegate_to: "{{ groups.mongos | first }}"
      register: result
      changed_when: >
        "already registered, skipping." not in result.stdout     
      when: mongodb_primary is defined and mongodb_primary
