---
- name: Install pmm-client package from repository (latest)
  package:
    name: "{{ pmm_client_package }}"
    state: present
  # Service hosts can be shared by inventories that run in parallel; retry if
  # another run holds the package manager lock.
  register: pmm_client_pkg
  until: pmm_client_pkg is succeeded
  retries: 5
  delay: 30
  when:
    - pmm_client_version is not defined or pmm_client_version == ''

- name: Install pmm-client packages from repository (specific version – Debian/Ubuntu)
  apt:
    name: "{{ pmm_client_package | map('regex_replace', '^pmm-client$', 'pmm-client=' ~ pmm_client_version ~ '*') | list }}"
    state: present
    allow_downgrade: true
    lock_timeout: 300
  when:
    - pmm_client_version is defined and pmm_client_version != ''
    - ansible_facts['os_family'] == 'Debian'

- name: Install pmm-client packages from repository (specific version – RedHat)
  yum:
    name: "{{ pmm_client_package | map('regex_replace', '^pmm-client$', 'pmm-client-' ~ pmm_client_version) | list }}"
    state: present
  when:
    - pmm_client_version is defined and pmm_client_version != ''
    - ansible_facts['os_family'] == 'RedHat'

- name: Disable Percona telemetry
  systemd:
    name: percona-telemetry-agent
    enabled: false
    state: stopped
    daemon_reload: yes
  ignore_errors: true
  when:
    - disable_telemetry | bool
